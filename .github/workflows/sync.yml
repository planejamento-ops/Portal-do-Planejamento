name: Sincronizar Painel

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar script de sincronização
        run: python sync_painel.py

      - name: Commitar dados_tu.js
        run: |
          git config user.name "Robo Painel"
          git config user.email "robo@painel.local"
          git add dados_tu.js
          git diff --staged --quiet || git commit -m "Auto-sync $(date '+%H:%M')"
          git push
