name: Robô de Atualizacao Automatica

on:
  schedule:
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl

      - name: Executar o Atualizador.py
        run: python Atualizador.py

      - name: Publicar dados_tu.js atualizado no site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dados_tu.js
          git diff-index --quiet HEAD || git commit -m "🤖 [AUTO-SYNC] Atualizando dados do portal"
          git push origin main
